[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-forge"
version = "0.1.0"
description = "Production-grade tabular machine learning: gradient boosting derived from first principles."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Haydar Kılıç" }]
keywords = [
    "gradient-boosting",
    "xgboost",
    "lightgbm",
    "catboost",
    "tabular",
    "optuna",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "optuna>=3.6",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "black>=24.0",
    "ruff>=0.4",
    "isort>=5.13",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbqa>=1.8",
]
deploy = [
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "streamlit>=1.34",
]

[project.urls]
Homepage   = "https://github.com/HAYDARKILIC/gradient-forge"
Repository = "https://github.com/HAYDARKILIC/gradient-forge"
Issues     = "https://github.com/HAYDARKILIC/gradient-forge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length    = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile     = "black"
line_length = 100

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version       = "3.10"
strict               = true
warn_return_any      = true
warn_unused_configs  = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts    = "-ra -q --cov=gradient_forge --cov-report=term-missing --cov-report=html"
testpaths  = ["tests"]
