# XGBoost — default production-grade configuration
xgboost:
  task: binary
  n_estimators: 1000
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  reg_lambda: 1.0
  reg_alpha: 0.0
  subsample: 0.8
  colsample_bytree: 0.8
  gpu: false
  random_state: 42
  extra_params:
    objective: binary:logistic
    eval_metric: auc
