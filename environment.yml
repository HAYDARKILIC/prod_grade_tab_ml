name: gradient-forge
channels:
  - conda-forge
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.4
  - xgboost>=2.0
  - lightgbm>=4.3
  - matplotlib>=3.8
  - seaborn>=0.13
  - jupyterlab>=4.1
  - ipykernel>=6.29
  - tqdm>=4.66
  - pyyaml>=6.0
  - joblib>=1.3
  - psutil>=5.9
  # CUDA toolkit (uncomment for GPU support)
  # - cudatoolkit=12.1
  - pip:
      - catboost>=1.2
      - optuna>=3.6
      - optuna-integration>=3.6
      - rich>=13.7
      - memory-profiler>=0.61
      - onnx>=1.16
      - onnxruntime>=1.17
      - streamlit>=1.34
      - -e .
